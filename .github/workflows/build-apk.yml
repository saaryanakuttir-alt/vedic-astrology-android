name: Build Android APK

# Builds the debug .apk with Buildozer on GitHub's own runners (which have
# full internet access to fetch the Android SDK/NDK and python-for-android
# itself), then uploads it as a downloadable workflow artifact. This exists
# because this project was developed in two sandboxed environments (a cloud
# workspace and, separately, the user's own PC) that BOTH block general
# internet access to package registries/SDK downloads - see
# android_app/README_ANDROID.md for the full story. Push this folder's
# contents to a GitHub repo and this workflow builds the APK for you.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev liblzma-dev uuid-dev libbz2-dev \
            libsqlite3-dev libreadline-dev libgdbm-dev libgdbm-compat-dev
          # libltdl-dev specifically: provides /usr/share/aclocal/ltdl.m4,
          # which defines the LT_SYS_SYMBOL_USCORE macro libffi's own
          # configure.ac needs - without it, libffi's autoreconf step fails
          # with "possibly undefined macro: LT_SYS_SYMBOL_USCORE" (plain
          # libtool/libtool-bin isn't enough on Ubuntu).
          #
          # buildozer is pinned to 1.5.0 (Jan 2023) to match the pinned
          # python-for-android release in buildozer.spec's p4a.branch
          # (v2024.01.21, see that file's comment for the full story) -
          # buildozer's own most recent release (1.6.0/2.7, May 2026) was
          # built alongside p4a's new Python-3.14-targeting rewrite and
          # isn't tested against the older p4a we're deliberately using here.
          #
          # Cython is pinned to the classic 0.29.36, NOT a modern 3.x
          # release. This p4a (v2024.01.21) uses ONE globally-installed
          # `cython` for every recipe (no per-recipe isolated build-env like
          # newer p4a releases have), and pyjnius 1.6.1's jnius_utils.pxi
          # uses `isinstance(arg, long)` - Cython 3.x removed `long` from
          # its builtin namespace entirely (Python 3 unified int/long),
          # failing with "undeclared name not builtin: long". Cython 0.29.x
          # still recognizes it, and Kivy 2.3.1 (pinned above) supports
          # being built with either Cython line, so 0.29.36 is simply
          # correct for this whole pinned-toolchain environment - verified
          # by a full local build (2026-09-06, Docker/Ubuntu 22.04) that
          # produced a working, installable debug APK end to end.
          pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Build debug APK with Buildozer
        run: |
          # This runner has several JDKs pre-installed (8/11/17/21/25), and
          # its default JAVA_HOME resolves to JDK 11 - too old for the
          # Gradle version p4a v2024.01.21's generated project template
          # uses, which fails Gradle's own final APK-assembly step with
          # "Your current JDK is located in .../temurin-11-jdk-amd64" and
          # a Gradle-9-incompatibility warning (confirmed failure,
          # 2026-09-06 run). Installing openjdk-17-jdk above isn't enough
          # by itself since it doesn't change which JDK is *active* -
          # point JAVA_HOME at it explicitly.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vedic-astrology-debug-apk
          path: bin/*.apk
          if-no-files-found: error
